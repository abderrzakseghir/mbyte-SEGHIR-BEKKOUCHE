store.root=${HOME}/.mbyte
%dev.store.root=/tmp/mbyte-dev

store.auth.owner=sheldon
store.data.home=${store.root}/data
store.index.home=${store.root}/index
store.topology.enabled=true
store.topology.https=false
store.topology.host=consul
store.topology.port=8500
store.topology.service.name=${store.auth.owner}
store.topology.service.protocol=http
store.topology.service.host=${store.topology.service.name}.localhost
store.topology.service.port=80

quarkus.liquibase.migrate-at-start=true

quarkus.http.port=8089

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.forwarded-host-header=X-ORIGINAL-HOST

quarkus.http.auth.policy.users.roles-allowed=user
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=users

quarkus.oidc.auth-server-url=http://auth.mbyte.fr/realms/mbyte
quarkus.oidc.client-id=mbyte
quarkus.oidc.credentials.client-secret.value=cTTS3QJaKRXIMOjip6EjlbIqZbvO2uFU
quarkus.oidc.application-type=hybrid
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=resource_access/mbyte/roles
quarkus.oidc.token-state-manager.split-tokens=true

quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=mbyte
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/store
%test.quarkus.datasource.jdbc.url=
quarkus.datasource.jdbc.max-size=16

quarkus.log.category."io.quarkus.oidc".level=DEBUG
quarkus.log.category."io.quarkus.oidc.runtime".level=DEBUG
quarkus.log.category."fr.jayblanc.mbyte.store".level=DEBUG
quarkus.oidc.token.verify-access-token-with-user-info=true

# ========================================
# External Storage Backend Configuration
# ========================================

# Backend type: LOCAL, S3, WEBDAV, GOOGLE_DRIVE, DROPBOX, ONEDRIVE, MULTI
mbyte.store.backend.type=S3
# Enable encryption for stored data
mbyte.store.backend.encrypt=false
# Fallback to local storage if external backend is unavailable
mbyte.store.backend.fallback-to-local=true

# --- Local Storage Configuration ---
mbyte.store.backend.local.base-path=${store.root}/data/external

# --- S3/MinIO Configuration ---
# Set mbyte.store.backend.type=S3 to use S3 storage
mbyte.store.backend.s3.enabled=true
mbyte.store.backend.s3.endpoint=http://minio:9000
mbyte.store.backend.s3.access-key=minioadmin
mbyte.store.backend.s3.secret-key=minioadmin
mbyte.store.backend.s3.bucket=mbyte-stores
mbyte.store.backend.s3.region=us-east-1
mbyte.store.backend.s3.path-style-access=true
mbyte.store.backend.s3.auto-create-bucket=true

# --- WebDAV Configuration ---
# Set mbyte.store.backend.type=WEBDAV to use WebDAV storage
mbyte.store.backend.webdav.enabled=false
#mbyte.store.backend.webdav.url=https://webdav.example.com/mbyte
#mbyte.store.backend.webdav.username=user
#mbyte.store.backend.webdav.password=secret
mbyte.store.backend.webdav.auto-create-directories=true

# --- Google Drive Configuration ---
# Set mbyte.store.backend.type=GOOGLE_DRIVE to use Google Drive storage
mbyte.store.backend.googledrive.enabled=false
#mbyte.store.backend.googledrive.client-id=YOUR_GOOGLE_CLIENT_ID
#mbyte.store.backend.googledrive.client-secret=YOUR_GOOGLE_CLIENT_SECRET
#mbyte.store.backend.googledrive.refresh-token=YOUR_REFRESH_TOKEN
mbyte.store.backend.googledrive.application-name=MByte-Store
#mbyte.store.backend.googledrive.root-folder-id=root

# --- Dropbox Configuration ---
# Set mbyte.store.backend.type=DROPBOX to use Dropbox storage
mbyte.store.backend.dropbox.enabled=false
#mbyte.store.backend.dropbox.access-token=YOUR_DROPBOX_ACCESS_TOKEN
#mbyte.store.backend.dropbox.app-key=YOUR_APP_KEY
#mbyte.store.backend.dropbox.app-secret=YOUR_APP_SECRET
#mbyte.store.backend.dropbox.refresh-token=YOUR_REFRESH_TOKEN
mbyte.store.backend.dropbox.root-path=/mbyte-store

# --- OneDrive Configuration ---
# Set mbyte.store.backend.type=ONEDRIVE to use OneDrive storage
mbyte.store.backend.onedrive.enabled=false
#mbyte.store.backend.onedrive.client-id=YOUR_AZURE_CLIENT_ID
#mbyte.store.backend.onedrive.client-secret=YOUR_AZURE_CLIENT_SECRET
mbyte.store.backend.onedrive.tenant-id=common
#mbyte.store.backend.onedrive.refresh-token=YOUR_REFRESH_TOKEN
mbyte.store.backend.onedrive.root-path=/mbyte-store
mbyte.store.backend.onedrive.use-application-auth=false

# ========================================
# Multi-Backend Configuration (Redundancy & Load Balancing)
# ========================================
# Set mbyte.store.backend.type=MULTI to enable multi-backend mode
mbyte.store.backend.multi.enabled=false
# Comma-separated list of backends to use (order matters for PRIMARY_FIRST)
mbyte.store.backend.multi.backends=S3,LOCAL
# How many backends should store each file (redundancy)
mbyte.store.backend.multi.redundancy-level=2
# Load balancing strategy: ROUND_ROBIN, RANDOM, FASTEST, PRIMARY_FIRST
mbyte.store.backend.multi.load-balancing-strategy=ROUND_ROBIN
# Fail if redundancy level not met
mbyte.store.backend.multi.fail-on-partial-write=false
# Minimum writes required for success
mbyte.store.backend.multi.minimum-writes=1
# Health check interval in seconds
mbyte.store.backend.multi.health-check-interval=60

# --- Auto-Placement Configuration ---
mbyte.store.backend.multi.auto-placement-enabled=false
# Threshold for large files (10MB default)
mbyte.store.backend.multi.large-file-threshold=10485760
# Preferred backend for large files
#mbyte.store.backend.multi.large-file-backend=S3
# Preferred backend for frequently accessed files (hot storage)
#mbyte.store.backend.multi.hot-storage-backend=LOCAL
# Preferred backend for rarely accessed files (cold storage)
#mbyte.store.backend.multi.cold-storage-backend=GOOGLE_DRIVE

# --- Cipher Configuration ---
# Enable encryption for data stored in external backends
mbyte.store.cipher.enabled=false
mbyte.store.cipher.algorithm=AES/GCM/NoPadding
mbyte.store.cipher.key-size=256
mbyte.store.cipher.iv-size=12
mbyte.store.cipher.tag-length=128
# Secret key (Base64 encoded, 256-bit key)
# Generate with: openssl rand -base64 32
# IMPORTANT: Set this for production to ensure data can be decrypted after restarts
#mbyte.store.cipher.secret-key=YOUR_BASE64_ENCODED_32_BYTE_KEY_HERE

